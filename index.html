<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Анимация 4 — Космонавт в космосе</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <header class="intro">
      <p class="eyebrow">Лабораторная работа · HTML + CSS</p>
      <h1>Анимация 4 <span>🚀</span></h1>
      <p>Космонавт парит в невесомости, а звёзды мерцают на фоне далёкой планеты.</p>
    </header>

    <div class="space-card" role="img" aria-label="Белый космонавт плавает в космосе перед оранжевой планетой; звёзды мерцают">
      <div class="orbit">
        <div class="planet"><i class="planet-shine"></i><i class="stripe s1"></i><i class="stripe s2"></i><i class="stripe s3"></i><i class="stripe s4"></i><i class="stripe s5"></i><i class="stripe s6"></i><i class="stripe s7"></i></div>

        <div class="stars" aria-hidden="true">
          <i class="star star-1"></i><i class="star star-2"></i><i class="star star-3"></i>
          <i class="star star-4"></i><i class="star star-5"></i><i class="star star-6"></i>
          <i class="star star-7"></i><i class="star star-8"></i><i class="star star-9"></i>
          <i class="star star-10"></i><i class="star star-11"></i><i class="star star-12"></i>
        </div>

        <div class="floating">
          <div class="astronaut">
            <div class="hose"></div>
            <div class="backpack"></div>
            <div class="leg leg-left"><div class="boot"></div></div>
            <div class="leg leg-right"><div class="boot"></div></div>
            <div class="arm arm-left"><div class="glove"></div></div>
            <div class="arm arm-right"><div class="glove"></div></div>
            <div class="body-suit"><div class="panel"><b></b><b></b><b></b></div></div>
            <div class="neck"></div>
            <div class="helmet"><div class="visor"><i></i></div><div class="helmet-highlight"></div></div>
          </div>
        </div>
      </div>
    </div>
    <p class="note">Анимация выполнена без JavaScript и изображений: только HTML и CSS.</p>
  </main>
</body>
</html>
